services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DATABASE: corcoiote
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - 5432:5432
    volumes:
      # ERRO DO PROFESSOR: ele montou o volume em /var/lib/postgresql/corcoiote,
      # mas essa NÃO é a pasta onde o Postgres realmente grava os dados. A
      # imagem oficial postgres:17 usa /var/lib/postgresql/data como diretório
      # de dados de verdade (é o valor padrão de PGDATA dela). Como o volume
      # nomeado "postgres" ficava montado no lugar errado, ele nunca guardava
      # nada — quem segurava os dados de verdade era um volume anônimo criado
      # pelo Docker por baixo dos panos, que se perde se o container for
      # removido (docker compose down + up cria um container novo, com um
      # volume anônimo novo e vazio).
      # - postgres:/var/lib/postgresql/corcoiote
      - postgres:/var/lib/postgresql/data

volumes:
  postgres: